[build-system]
requires = ["setuptools==75.5.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "calorie-estimation"
version = "0.1.0"
description = "Reproducible study of calorie-label estimation with fewer measurements"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==1.26.4", "pandas==2.2.3", "scikit-learn==1.8.0",
  "xgboost==2.0.3", "scipy==1.12.0", "matplotlib==3.10.8",
  "joblib==1.3.2", "threadpoolctl==3.3.0",
]

[project.scripts]
calorie-estimation = "calorie_estimation.cli:main"

[tool.setuptools.packages.find]
include = ["calorie_estimation*"]
